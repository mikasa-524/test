<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>秒达外卖 - 送啥都快</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
:root{
  --yellow:#FFC300; --yellow-2:#FFA800; --yellow-deep:#F59A00;
  --yellow-bg:#FFF6DF; --red:#FF3D00; --red-bg:#FFF1EC;
  --ink:#1A1A1A; --gray:#5F5F5F; --gray-2:#9A9A9A; --line:#EFEFEF;
  --bg:#F4F4F4; --card:#fff; --r:14px; --r-sm:10px;
  --shadow:0 2px 10px rgba(0,0,0,.05);
  --tab-h:56px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;outline:none}
.app{max-width:960px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom))}
.view{display:none}
.view.active{display:block;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ic{width:1em;height:1em;fill:currentColor;vertical-align:-.12em}

/* ===== 顶部导航条 ===== */
.topbar{position:sticky;top:0;z-index:50}
.topbar.home{background:linear-gradient(180deg,var(--yellow) 0%,var(--yellow-2) 100%);color:#3A2A00}
.topbar-home{padding:10px 14px 12px}
.loc-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.loc{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:700;max-width:70%;overflow:hidden;white-space:nowrap}
.loc .ic{font-size:15px}
.loc-arrow{font-size:10px;flex:none}
.weather{font-size:12px;opacity:.85;display:flex;align-items:center;gap:4px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:9px 14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.search .ic{color:var(--gray-2);font-size:16px;flex:none}
.search input{flex:1;border:none;font-size:14px;background:transparent;color:var(--ink)}
.search input::placeholder{color:var(--gray-2)}
.search .search-btn{color:#3A2A00;font-size:14px;font-weight:600;flex:none}
.topbar.simple{background:#fff;box-shadow:0 1px 0 var(--line)}
.topbar-simple{display:flex;align-items:center;gap:12px;padding:12px 14px;max-width:960px;margin:0 auto}
.topbar-simple .back{font-size:22px;color:var(--ink);display:flex;align-items:center}
.topbar-simple .title{font-size:16px;font-weight:700;flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.topbar-simple .spacer{width:22px}

/* ===== 金刚区 ===== */
.cats{display:grid;grid-template-columns:repeat(8,1fr);background:#fff;padding:14px 6px 12px;gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--gray)}
.cat .cat-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}
.cat:nth-child(1) .cat-ic{background:linear-gradient(135deg,#FFB347,#FF8C00)}
.cat:nth-child(2) .cat-ic{background:linear-gradient(135deg,#8BC34A,#4CAF50)}
.cat:nth-child(3) .cat-ic{background:linear-gradient(135deg,#FFA94D,#FF7A45)}
.cat:nth-child(4) .cat-ic{background:linear-gradient(135deg,#5C6BC0,#3F51B5)}
.cat:nth-child(5) .cat-ic{background:linear-gradient(135deg,#FF6B6B,#EE5A24)}
.cat:nth-child(6) .cat-ic{background:linear-gradient(135deg,#26C6DA,#00ACC1)}
.cat:nth-child(7) .cat-ic{background:linear-gradient(135deg,#D4A96A,#B8860B)}
.cat:nth-child(8) .cat-ic{background:linear-gradient(135deg,#7E57C2,#5E35B1)}

/* ===== Banner ===== */
.banner-wrap{padding:12px 12px 4px}
.banner{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.banner img{width:100%;height:150px;object-fit:cover}
.banner-overlay{position:absolute;inset:0;background:linear-gradient(100deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,.18) 55%,transparent 78%);display:flex;flex-direction:column;justify-content:center;padding:0 18px;color:#fff}
.banner-overlay .b-t1{font-size:22px;font-weight:800;letter-spacing:1px;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.banner-overlay .b-t2{font-size:13px;margin-top:4px;opacity:.95}
.banner-overlay .b-tag{display:inline-block;margin-top:10px;align-self:flex-start;background:var(--yellow);color:#3A2A00;font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px}

/* ===== 商家列表 ===== */
.shop-section{padding:10px 12px 16px}
.shop-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px}
.shop-head h2{font-size:17px;font-weight:800}
.shop-head .cnt{color:var(--gray-2);font-size:12px}
.sort-row{display:flex;gap:18px;margin-bottom:8px;padding:0 2px}
.sort-btn{font-size:13px;color:var(--gray);padding:4px 0;position:relative}
.sort-btn.on{color:var(--ink);font-weight:700}
.sort-btn.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:18px;height:3px;border-radius:2px;background:var(--yellow)}
.shop-grid{display:grid;grid-template-columns:1fr;gap:12px}
.shop-card{background:var(--card);border-radius:var(--r);padding:12px;display:flex;gap:12px;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
.shop-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.shop-cover{width:88px;height:88px;border-radius:var(--r-sm);object-fit:cover;flex:none}
.shop-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.shop-name{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px}
.shop-name .badge{background:var(--yellow);color:#3A2A00;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;flex:none}
.shop-rate{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray)}
.shop-rate .star{color:var(--yellow-deep);font-weight:700}
.shop-rate .star .ic{font-size:12px}
.shop-meta{font-size:12px;color:var(--gray);display:flex;gap:8px;align-items:center}
.shop-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--gray-2);flex:none}
.shop-promo{display:flex;flex-direction:column;gap:4px}
.promo-tag{font-size:11px;display:flex;align-items:center;gap:6px;color:var(--gray)}
.promo-tag .p-badge{flex:none;background:var(--red-bg);color:var(--red);border:1px solid #FFD9C9;padding:0 4px;border-radius:3px;font-weight:600;line-height:16px}

/* ===== 商家详情 ===== */
.shop-hero{position:relative;height:170px;overflow:hidden}
.shop-hero img{width:100%;height:100%;object-fit:cover}
.shop-hero .hero-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 40%,rgba(0,0,0,.55) 100%)}
.shop-hero .hero-msg{position:absolute;left:14px;right:14px;bottom:12px;color:#fff}
.shop-hero .hero-name{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.shop-hero .hero-name .badge{background:var(--yellow);color:#3A2A00;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px}
.shop-hero .hero-sub{font-size:12px;opacity:.95;margin-top:2px;display:flex;gap:10px;align-items:center}
.shop-hero .hero-notice{font-size:11px;opacity:.9;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.shop-hero .back-btn{position:absolute;top:12px;left:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.shop-hero .cart-icon-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.menu-body{display:flex;background:#fff;min-height:calc(100vh - 170px - var(--tab-h))}
.cat-side{width:96px;flex:none;background:#F7F7F7;overflow-y:auto;padding-bottom:20px}
.cat-side .c-item{padding:14px 8px;font-size:12px;color:var(--gray);text-align:center;cursor:pointer;border-left:3px solid transparent}
.cat-side .c-item.on{background:#fff;color:var(--ink);font-weight:700;border-left-color:var(--yellow)}
.dish-area{flex:1;min-width:0;padding:4px 12px 120px;max-height:calc(100vh - 170px - var(--tab-h));overflow-y:auto}
.dish-cat-title{font-size:15px;font-weight:800;padding:14px 2px 8px}
.dish-card{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.dish-card:last-child{border-bottom:none}
.dish-img{width:86px;height:86px;border-radius:var(--r-sm);object-fit:cover;flex:none}
.dish-info{flex:1;min-width:0;display:flex;flex-direction:column}
.dish-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px}
.dish-name .hot{color:var(--red);font-size:10px;border:1px solid #FFC2AE;padding:0 4px;border-radius:3px;flex:none}
.dish-desc{font-size:12px;color:var(--gray-2);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dish-sales{font-size:11px;color:var(--gray-2);margin-top:3px}
.dish-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.dish-price{font-size:15px;font-weight:800}
.dish-price .unit{font-size:11px;font-weight:600}
.add-btn{width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#3A2A00;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 6px rgba(255,168,0,.4)}
.qty-wrap{display:flex;align-items:center;gap:10px}
.minus-btn{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--yellow);color:var(--yellow-deep);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.qty-num{font-size:14px;font-weight:700;min-width:16px;text-align:center}

/* ===== 购物车栏 ===== */
.cart-bar{position:fixed;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:960px;z-index:60;padding:0 12px 8px;pointer-events:none}
.cart-bar-inner{background:rgba(26,26,26,.95);border-radius:30px;display:flex;align-items:center;justify-content:space-between;color:#fff;padding:8px 8px 8px 18px;box-shadow:0 6px 24px rgba(0,0,0,.25);pointer-events:auto;backdrop-filter:blur(6px)}
.cart-left{display:flex;align-items:center;gap:12px;min-width:0}
.cart-icon{position:relative;width:46px;height:46px;border-radius:50%;background:var(--yellow);color:#3A2A00;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.cart-icon .cnt{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cart-price{font-size:17px;font-weight:800}
.cart-price small{font-size:11px;font-weight:600}
.cart-tip{font-size:11px;color:#C9C9C9;margin-top:-2px}
.cart-cta{flex:none;background:var(--yellow);color:#3A2A00;font-size:15px;font-weight:800;padding:11px 26px;border-radius:24px}
.cart-cta.disabled{background:#C9C9C9;color:#fff}

/* ===== 购物车弹层 ===== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.show{opacity:1;pointer-events:auto}
.panel{position:fixed;left:50%;transform:translateX(-50%) translateY(100%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));width:100%;max-width:960px;background:#fff;border-radius:18px 18px 0 0;z-index:90;transition:transform .25s ease;max-height:60vh;display:flex;flex-direction:column}
.panel.show{transform:translateX(-50%) translateY(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-head .ph-name{font-size:16px;font-weight:800}
.panel-head .clear{font-size:12px;color:var(--gray-2);display:flex;align-items:center;gap:4px}
.panel-list{overflow-y:auto;padding:0 16px;flex:1}
.panel-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.panel-item:last-child{border-bottom:none}
.pi-name{font-size:14px;font-weight:600}
.pi-price{font-size:13px;color:var(--gray);margin-top:2px}
.panel-empty{text-align:center;color:var(--gray-2);font-size:13px;padding:50px 0}
.panel-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.panel-total{font-size:15px}
.panel-total b{font-size:20px;color:var(--ink);font-weight:800}

/* ===== 通用卡片/列表 ===== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:12px}
.card-pad{padding:14px 16px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.cell{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.cell:last-child{border-bottom:none}
.cell .clabel{display:flex;align-items:center;gap:10px;font-size:14px}
.cell .cvalue{color:var(--gray);font-size:13px;display:flex;align-items:center;gap:4px}
.arrow{font-size:12px;color:var(--gray-2)}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--yellow-bg);color:#8A5A00;font-weight:600}

/* ===== 结算页 ===== */
.addr-card{background:linear-gradient(135deg,#FFF3C4,#FFE28A);border-radius:var(--r);margin:12px;padding:16px;display:flex;align-items:flex-start;gap:12px;position:relative}
.addr-card .a-ic{font-size:20px;color:#8A5A00;flex:none;margin-top:2px}
.addr-card .a-name{font-size:15px;font-weight:800}
.addr-card .a-phone{font-size:13px;color:#6B4E00;margin-left:8px;font-weight:600}
.addr-card .a-detail{font-size:13px;color:#6B4E00;margin-top:3px}
.addr-card .a-edit{position:absolute;right:14px;top:16px;color:#8A5A00}
.sec-title{font-size:15px;font-weight:800;padding:14px 16px 6px}
.pay-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.pay-opt:last-child{border-bottom:none}
.pay-opt .p-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex:none}
.pay-opt .p-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.pay-opt .p-name small{font-size:11px;color:var(--gray-2);font-weight:400}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #D8D8D8;flex:none;position:relative}
.radio.on{border-color:var(--yellow-deep)}
.radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--yellow-deep)}
.price-line{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;color:var(--gray)}
.price-line.total{color:var(--ink);font-weight:800;font-size:14px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.price-line .cut{color:var(--red)}
.submit-bar{position:fixed;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:960px;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:flex-end;gap:16px;box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:60}
.submit-total{font-size:14px}
.submit-total b{font-size:22px;font-weight:800}
.submit-total small{color:var(--gray-2);font-size:11px}
.submit-btn{background:var(--yellow);color:#3A2A00;font-size:16px;font-weight:800;padding:12px 34px;border-radius:26px}

/* ===== 订单 ===== */
.order-tabs{display:flex;background:#fff;position:sticky;top:0;z-index:40}
.order-tab{flex:1;text-align:center;padding:13px 0;font-size:14px;color:var(--gray);position:relative;cursor:pointer}
.order-tab.on{color:var(--ink);font-weight:700}
.order-tab.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:26px;height:3px;border-radius:2px;background:var(--yellow)}
.order-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:12px;overflow:hidden}
.order-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.order-shop{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.order-status{font-size:12px;font-weight:700;color:var(--yellow-deep)}
.order-status.done{color:var(--gray-2)}
.order-body{display:flex;align-items:center;gap:12px;padding:14px 16px}
.order-cover{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.order-dish{font-size:13px;color:var(--gray);flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.order-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line)}
.order-time{font-size:12px;color:var(--gray-2)}
.order-amount{font-size:14px;font-weight:800}
.order-amount small{font-size:11px;color:var(--gray-2);font-weight:400}
.order-btns{display:flex;gap:8px;padding:0 16px 14px;justify-content:flex-end}
.obtn{font-size:12px;padding:6px 16px;border-radius:16px;border:1px solid var(--line);color:var(--gray)}
.obtn.main{background:var(--yellow);color:#3A2A00;border-color:var(--yellow);font-weight:700}
.empty{text-align:center;padding:80px 20px;color:var(--gray-2)}
.empty .e-ic{font-size:48px;margin-bottom:12px;opacity:.4}
.empty p{font-size:14px;margin-bottom:16px}
.empty .go-btn{display:inline-block;background:var(--yellow);color:#3A2A00;font-size:14px;font-weight:700;padding:10px 34px;border-radius:24px}

/* ===== 我的 ===== */
.mine-head{background:linear-gradient(135deg,var(--yellow) 0%,var(--yellow-2) 100%);padding:30px 20px 24px;display:flex;align-items:center;gap:14px;color:#3A2A00}
.mine-avatar{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--yellow-deep);font-weight:800;flex:none}
.mine-name{font-size:18px;font-weight:800}
.mine-phone{font-size:12px;opacity:.8;margin-top:2px}
.mine-cards{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:12px;overflow:hidden}
.mine-head{min-height:132px;padding:28px 20px;background:linear-gradient(115deg,#FFD84D 0%,#FFB52E 58%,#FF9638 100%);position:relative;overflow:hidden}
.mine-head::after{content:"";position:absolute;width:190px;height:190px;border:1px solid rgba(255,255,255,.28);border-radius:50%;right:-52px;top:-76px;box-shadow:0 0 0 22px rgba(255,255,255,.08),0 0 0 44px rgba(255,255,255,.06)}
.mine-head>*{position:relative;z-index:1}
.mine-avatar{box-shadow:0 5px 14px rgba(111,73,0,.12)}
.mine-auth-actions{display:flex;gap:9px;margin-top:12px}
.mine-auth-btn{min-width:78px;padding:7px 14px;border:1px solid rgba(58,42,0,.28);border-radius:20px;font-size:12px;font-weight:700;text-align:center}
.mine-auth-btn.primary{background:#382A0C;color:#fff;border-color:#382A0C}
.mine-cards{border-radius:12px}
.auth-page{min-height:100vh;background:#fff;overflow:hidden}
.auth-top{height:210px;position:relative;overflow:hidden;background:#332819}
.auth-top img{width:100%;height:100%;object-fit:cover;opacity:.72}
.auth-top::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,18,14,.76),rgba(20,18,14,.08) 100%)}
.auth-top-copy{position:absolute;z-index:1;left:22px;right:22px;bottom:23px;color:#fff}
.auth-brand{font-size:12px;font-weight:700;letter-spacing:2px;color:#FFE28A}
.auth-top-title{font-size:25px;font-weight:800;margin-top:4px}
.auth-top-sub{font-size:12px;color:rgba(255,255,255,.84);margin-top:3px}
.auth-back{position:absolute;z-index:2;top:16px;left:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:20px}

.auth-heading p{font-size:12px;color:var(--gray-2);margin-top:2px}
.auth-switch{color:#9A6500;font-size:12px;font-weight:700;padding:6px 0 6px 10px}
.auth-field{display:block;margin-bottom:13px}
.auth-field>span{display:block;font-size:12px;color:#484848;font-weight:700;margin-bottom:6px}
.auth-input{width:100%;height:48px;border:1px solid #E9E6E0;border-radius:9px;padding:0 13px;background:#FCFBF8;font-size:14px;transition:border-color .18s,box-shadow .18s}
.auth-input:focus{border-color:#E8A900;box-shadow:0 0 0 3px rgba(255,195,0,.16)}
.auth-submit{width:100%;height:48px;background:linear-gradient(100deg,#FFC300,#FFA51D);border-radius:9px;color:#382A0C;font-size:15px;font-weight:800;margin-top:5px;box-shadow:0 5px 13px rgba(255,168,0,.2)}
.auth-note{font-size:11px;line-height:1.7;color:var(--gray-2);text-align:center;margin-top:14px}
.auth-divider{height:1px;background:var(--line);margin:20px 0 14px}
.auth-footer{font-size:11px;color:var(--gray-2);text-align:center}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;font-size:13px;padding:10px 20px;border-radius:10px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;text-align:center}
.toast.show{opacity:1}

/* ===== 搜索 ===== */
.search-panel{padding:0 12px}
.search-result-tip{font-size:13px;color:var(--gray-2);padding:14px 4px}

/* ===== 地址弹层 ===== */
.addr-panel{position:fixed;left:50%;transform:translateX(-50%) translateY(100%);bottom:0;width:100%;max-width:960px;background:#fff;border-radius:18px 18px 0 0;z-index:90;transition:transform .25s ease;max-height:70vh;display:flex;flex-direction:column}
.addr-panel.show{transform:translateX(-50%) translateY(0)}
.addr-panel .panel-list{padding:0 0 12px}
.addr-item{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.addr-item .a-name{font-size:14px;font-weight:700}
.addr-item .a-detail{font-size:12px;color:var(--gray-2);margin-top:2px}
.addr-item .a-copy{flex:1;min-width:0}
.addr-actions{display:flex;align-items:center;gap:5px;flex:none}
.addr-action{width:32px;height:32px;border-radius:8px;color:var(--gray);display:flex;align-items:center;justify-content:center;font-size:15px}
.addr-action:hover{background:#F5F5F5;color:var(--ink)}
.addr-action.delete{color:var(--red)}
.addr-manage{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.addr-add-btn{width:100%;height:44px;border:1px solid #F1C24B;border-radius:9px;color:#8A5A00;font-size:14px;font-weight:700;background:#FFFBEE}
.addr-form{padding:8px 16px 18px;overflow-y:auto}
.addr-form label{display:block;margin:12px 0}
.addr-form label span{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.addr-form input,.addr-form textarea{width:100%;border:1px solid #E9E6E0;border-radius:8px;padding:11px 12px;background:#FCFBF8;font-size:14px;resize:vertical}
.addr-form input:focus,.addr-form textarea:focus{border-color:#E8A900;box-shadow:0 0 0 3px rgba(255,195,0,.14)}
.addr-form textarea{min-height:82px}
.addr-form .addr-save{width:100%;height:44px;background:var(--yellow);border-radius:9px;font-size:14px;font-weight:800;margin-top:8px}

function getShop(id){ return SHOPS.find(s => s.id === id); }
function getDish(shop, id){ return shop.dishes.find(d => d.id === id); }
function cartQty(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
function goodsTotal(shop){
  if(!shop) return 0;
  return shop.dishes.reduce((sum,d)=> sum + d.price * (state.cart[d.id]||0), 0);
}
function cartItems(shop){
  if(!shop) return [];
  return shop.dishes.filter(d => state.cart[d.id]).map(d => ({dish:d, qty:state.cart[d.id]}));
}
function discountOf(shop){
  const goods = goodsTotal(shop);
  return (shop.discount && goods >= shop.discount.full) ? shop.discount.cut : 0;
}
function fmt(n){ return n.toFixed(1).replace(/\.0$/,''); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove("show"), 1800);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function maskPhone(phone){ return phone.slice(0,3)+"****"+phone.slice(-4); }
async function passwordDigest(password, salt){
  const bytes = new TextEncoder().encode(salt+":"+password);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest), b=>b.toString(16).padStart(2,"0")).join("");
}

    '<div class="auth-content"><div class="auth-heading"><div><h1>'+(isRegister?'创建账号':'账号登录')+'</h1><p>'+(isRegister?'注册后即可开启你的美食时刻':'欢迎回来，继续探索附近好味道')+'</p></div><button class="auth-switch" data-action="switch-auth" data-mode="'+(isRegister?'login':'register')+'">'+(isRegister?'已有账号？登录':'注册账号')+'</button></div>'+

      (isRegister?'<label class="auth-field"><span>确认密码</span><input class="auth-input" name="confirmPassword" type="password" placeholder="请再次输入密码" minlength="8" autocomplete="new-password" required></label>':'')+

async function handleAuthSubmit(form){
  const values = new FormData(form);
  const mode = form.dataset.mode;
  const phone = String(values.get("phone")||"").trim();
  const password = String(values.get("password")||"");
  const accounts = loadStoredValue(AUTH_USERS_KEY, []);
  if(!/^1\d{10}$/.test(phone)){ toast("请输入有效的 11 位手机号"); return; }
  if(password.length < 8){ toast("密码至少需要 8 位"); return; }
  try {
    if(mode === "register"){
      const name = String(values.get("name")||"").trim();
      if(!name){ toast("请填写昵称"); return; }
      if(password !== values.get("confirmPassword")){ toast("两次输入的密码不一致"); return; }
      if(accounts.some(account=>account.phone===phone)){ toast("该手机号已注册，请直接登录"); return; }
      const salt = Array.from(crypto.getRandomValues(new Uint8Array(16)), b=>b.toString(16).padStart(2,"0")).join("");
      accounts.push({phone,name,salt,passwordHash:await passwordDigest(password,salt)});
      localStorage.setItem(AUTH_USERS_KEY, JSON.stringify(accounts));
      state.user = {phone,name};
    } else {
      const account = accounts.find(item=>item.phone===phone);
      if(!account || account.passwordHash !== await passwordDigest(password,account.salt)){ toast("手机号或密码不正确"); return; }
      state.user = {phone:account.phone,name:account.name};
    }
    localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(state.user));
    toast(mode === "register" ? "注册成功，欢迎加入秒达" : "登录成功，欢迎回来");
    const destination = state.authReturnTo || "#/mine";
    state.authReturnTo = null;
    location.hash = destination;
  } catch {
    toast("当前浏览器无法完成本地认证，请使用最新版浏览器");
  }
}

/* ================= 地址弹层 ================= */
function renderAddrPanel(){
  const panel = document.getElementById("addrPanel");
  panel.innerHTML =
    '<div class="panel-head"><div class="ph-name">收货地址</div><button class="clear" data-action="close-mask" style="font-size:12px;color:var(--gray-2)">关闭</button></div>'+
    '<div class="panel-list">'+(ADDRS.length ?
      ADDRS.map((a,i)=>
        '<div class="addr-item" data-action="set-addr" data-idx="'+i+'">'+
          '<span style="font-size:18px;color:var(--yellow-deep)">'+ic('loc')+'</span>'+
          '<div class="a-copy"><div class="a-name">'+esc(a.name)+' · '+maskPhone(a.phone)+'</div><div class="a-detail">'+esc(a.detail)+'</div></div>'+
          '<div class="addr-actions"><button class="addr-action" type="button" data-action="edit-address" data-idx="'+i+'" aria-label="编辑地址" title="编辑">'+ic('pen')+'</button><button class="addr-action delete" type="button" data-action="delete-address" data-idx="'+i+'" aria-label="删除地址" title="删除">'+ic('trash')+'</button></div>'+
          '<span class="radio'+(state.addressIdx===i?' on':'')+'"></span>'+
        '</div>'
      ).join("") : '<div class="panel-empty">还没有收货地址，添加一个方便配送</div>')+'</div>'+
    '<div class="addr-manage"><button class="addr-add-btn" data-action="add-address">+ 新增收货地址</button></div>';
  document.getElementById("mask").classList.add("show");
  panel.classList.add("show");
}
function renderAddressForm(index){
  const panel = document.getElementById("addrPanel");
  const addr = index === null ? null : ADDRS[index];
  panel.innerHTML =
    '<div class="panel-head"><div class="ph-name">'+(addr?'编辑收货地址':'新增收货地址')+'</div><button class="clear" data-action="back-address-list" style="font-size:12px;color:var(--gray-2)">返回</button></div>'+
    '<form class="addr-form" id="addressForm" data-index="'+(addr?index:'')+'">'+
      '<label><span>收货人</span><input name="name" type="text" maxlength="20" placeholder="请输入收货人姓名" value="'+(addr?esc(addr.name):'')+'" required></label>'+
      '<label><span>联系电话</span><input name="phone" type="tel" inputmode="numeric" maxlength="11" pattern="1[0-9]{10}" placeholder="请输入 11 位手机号" value="'+(addr?esc(addr.phone):'')+'" required></label>'+
      '<label><span>详细地址</span><textarea name="detail" maxlength="120" placeholder="街道、楼栋、门牌号" required>'+ (addr?esc(addr.detail):'') +'</textarea></label>'+
      '<button class="addr-save" type="submit">保存地址</button>'+
    '</form>';
  document.getElementById("mask").classList.add("show");
  panel.classList.add("show");
}
function saveAddress(form){
  const values = new FormData(form);
  const address = {
    name:String(values.get("name")||"").trim(),
    phone:String(values.get("phone")||"").trim(),
    detail:String(values.get("detail")||"").trim()
  };
  if(!address.name || !/^1\d{10}$/.test(address.phone) || !address.detail){ toast("请填写完整有效的地址信息"); return; }
  const index = form.dataset.index === "" ? -1 : Number(form.dataset.index);
  if(index >= 0){ ADDRS[index] = address; }
  else { ADDRS.push(address); state.addressIdx = ADDRS.length-1; }
  localStorage.setItem(ADDR_STORAGE_KEY, JSON.stringify(ADDRS));
  updateAddressCount();
  if((location.hash||"").includes("checkout")) renderCheckout();
  renderAddrPanel();
  toast(index >= 0 ? "地址已更新" : "地址已添加");
}
function deleteAddress(index){
  if(!Number.isInteger(index) || !ADDRS[index]) return;
  if(!window.confirm("确定删除这个收货地址吗？")) return;
  ADDRS.splice(index,1);
  if(ADDRS.length === 0) state.addressIdx = -1;
  else if(state.addressIdx === index) state.addressIdx = Math.min(index,ADDRS.length-1);
  else if(index < state.addressIdx) state.addressIdx--;
  localStorage.setItem(ADDR_STORAGE_KEY, JSON.stringify(ADDRS));
  updateAddressCount();
  if((location.hash||"").includes("checkout")) renderCheckout();
  renderAddrPanel();
  toast("地址已删除");
}
function closePanels(){
  document.getElementById("mask").classList.remove("show");
  document.getElementById("cartPanel").classList.remove("show");
  document.getElementById("addrPanel").classList.remove("show");
}

/* ================= 购物车操作 ================= */
function addDish(dishId){
  const shop = getShop(state.currentShopId);
  if(!shop) return;
  if(state.cartShopId && state.cartShopId !== shop.id){
    if(cartQty()>0){ state.cart = {}; toast("已切换至「"+shop.name+"」，原购物车已清空"); }
  }
  state.cartShopId = shop.id;
  state.cart[dishId] = (state.cart[dishId]||0) + 1;
  updateDishCard(shop, dishId);
}
function minusDish(dishId){
  const shop = getShop(state.currentShopId);
  if(!shop || !state.cart[dishId]) return;
  state.cart[dishId]--;
  if(state.cart[dishId] <= 0){
    delete state.cart[dishId];
    if(cartQty()===0) state.cartShopId = null;
  }
  updateDishCard(shop, dishId);
}
function updateDishCard(shop, dishId){
  const qty = state.cart[dishId]||0;
  const dish = getDish(shop, dishId);
  const card = document.querySelector('.dish-card[data-dish="'+dishId+'"]');
  if(card){
    card.querySelector(".dish-bottom").innerHTML =
      '<div class="dish-price"><span class="unit">¥</span>'+dish.price+'</div>'+
      (qty>0
        ? '<div class="qty-wrap"><button class="minus-btn" data-action="minus-dish" data-id="'+dishId+'">−</button><span class="qty-num">'+qty+'</span><button class="add-btn" data-action="add-dish" data-id="'+dishId+'">+</button></div>'
        : '<button class="add-btn" data-action="add-dish" data-id="'+dishId+'">+</button>');
  }
  renderCartBar(shop);
  const panel = document.getElementById("cartPanel");
  if(panel && panel.classList.contains("show")) openCartPanel(shop);
}

/* ================= 订单操作 ================= */
function submitOrder(){
  if(!state.user){
    state.authReturnTo = "#/checkout";
    location.hash = "#/auth/login";
    return;
  }
  const shop = getShop(state.cartShopId);
  if(!shop || !cartQty()) return;
  if(!ADDRS.length){ toast("请先添加收货地址"); renderAddrPanel(); return; }
  const items = cartItems(shop);
  const goods = goodsTotal(shop);
  if(goods < shop.minOrder){ toast("还差 ¥"+(shop.minOrder-goods)+" 起送"); return; }
  const cut = discountOf(shop);
  const pack = items.reduce((a,i)=>a+i.qty,0);
  const total = goods + pack + shop.deliveryFee - cut;
  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const order = {
    id: "MD"+now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+String(Math.floor(Math.random()*9000+1000)),
    shopId: shop.id, shopName: shop.name, cover: shop.cover,
    items: items.map(i=>({name:i.dish.name, qty:i.qty, price:i.dish.price})),
    total: total, time: "今天 "+now.getHours()+":"+pad(now.getMinutes()),
    status: "active", desc: "商家已接单，正在制作中，预计 "+shop.deliverTime+" 分钟送达"
  };
  orders.unshift(order);
  state.cart = {}; state.cartShopId = null;
  closePanels();
  toast("下单成功，骑手马上出发");
  location.hash = "#/orders";
}
function reorder(orderId){
  const o = orders.find(x=>x.id===orderId);
  if(!o) return;
  const shop = getShop(o.shopId);
  if(!shop) return;
  state.cart = {};
  o.items.forEach(i=>{
    const d = shop.dishes.find(x=>x.name===i.name);
    if(d) state.cart[d.id] = i.qty;
  });
  state.cartShopId = shop.id;
  location.hash = "#/shop/"+shop.id;
  toast("已为你重新加购，去结算吧");
}
function orderDetail(orderId){
  const o = orders.find(x=>x.id===orderId);
  toast(o ? o.desc : "订单不存在");
}

/* ================= 路由 ================= */
function router(){
  const h = location.hash || "#/home";
  const parts = h.slice(2).split("/");
  const p = parts[0];
  closePanels();
  document.getElementById("tabbar").style.display = p === "auth" ? "none" : "flex";
  if(p === "shop"){
    const shop = getShop(parseInt(parts[1],10));
    if(shop){ state.currentShopId = shop.id; renderShop(shop); updateTab("home"); }
    else location.hash = "#/home";
  } else if(p === "home"){ renderHome(); updateTab("home"); }
  else if(p === "checkout"){ renderCheckout(); updateTab("orders"); }
  else if(p === "orders"){ renderOrders(); updateTab("orders"); }
  else if(p === "mine"){ renderMine(); updateTab("mine"); }
  else if(p === "auth" && ["login","register"].includes(parts[1])){ renderAuth(parts[1]); }
  else location.hash = "#/home";
  window.scrollTo(0,0);
}

/* ================= 事件委托 ================= */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const act = el.dataset.action;
  const id = el.dataset.id;
  switch(act){
    case "open-shop": location.hash = "#/shop/"+id; break;
    case "go-home": location.hash = "#/home"; break;
    case "go-orders": location.hash = "#/orders"; break;
    case "open-auth": location.hash = "#/auth/"+(el.dataset.mode||"login"); break;
    case "switch-auth": location.hash = "#/auth/"+(el.dataset.mode||"login"); break;
    case "auth-back": location.hash = "#/mine"; break;
    case "logout":
      state.user = null;
      localStorage.removeItem(AUTH_SESSION_KEY);
      toast("已退出登录");
      renderMine();
      break;
    case "back-to-shop":
      if(state.cartShopId) location.hash = "#/shop/"+state.cartShopId;
      else location.hash = "#/home";
      break;
    case "set-cat":{
      const c = el.dataset.cat;
      if(c === "全部" || ["美食","甜品饮品","汉堡快餐","日料寿司"].includes(c)){
        state.catFilter = c === "全部" ? "all" : c;
        state.searchText = "";
        renderHome();
      } else {
        toast("「"+c+"」商家筹备中，敬请期待");
      }
      break;
    }
    case "sort": state.sortMode = el.dataset.mode; renderHome(); break;
    case "add-dish": addDish(parseInt(id,10)); break;
    case "minus-dish": minusDish(parseInt(id,10)); break;
    case "open-cart": if(cartQty()) openCartPanel(getShop(state.currentShopId)); break;
    case "open-addr": renderAddrPanel(); break;
    case "add-address": renderAddressForm(null); break;
    case "edit-address": renderAddressForm(parseInt(el.dataset.idx,10)); break;
    case "delete-address": deleteAddress(parseInt(el.dataset.idx,10)); break;
    case "back-address-list": renderAddrPanel(); break;
    case "close-mask": closePanels(); break;
    case "clear-cart":
      state.cart = {}; state.cartShopId = null; closePanels();
      if(state.currentShopId) renderShop(getShop(state.currentShopId));
      break;
    case "goto-checkout": closePanels(); location.hash = "#/checkout"; break;
    case "noop": break;
    case "set-pay": state.payMethod = el.dataset.pay; renderCheckout(); break;
    case "set-addr":
      state.addressIdx = parseInt(el.dataset.idx,10); closePanels();
      if((location.hash||"").indexOf("checkout") > -1) renderCheckout();
      break;
    case "submit-order": submitOrder(); break;
    case "set-order-tab": state.orderTab = el.dataset.tab; renderOrders(); break;
    case "reorder": reorder(id); break;
    case "order-detail": orderDetail(id); break;
    case "toast-act": toast(el.dataset.msg || ""); break;
  }
});

document.addEventListener("submit", function(e){
  if(e.target && e.target.id === "authForm"){
    e.preventDefault();
    handleAuthSubmit(e.target);
  } else if(e.target && e.target.id === "addressForm"){
    e.preventDefault();
    saveAddress(e.target);
  }
});

window.addEventListener("hashchange", router);
router();
</script>
